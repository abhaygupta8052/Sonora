<!DOCTYPE html>
<html lang="en" class="dark scrollbar-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sonora — Modern Music Streaming</title>
    
    <!-- Meta tags for SEO & PWA -->
    <meta name="description" content="Discover, stream, and organize your favorite music with Sonora. Free, ad-free, high-quality audio streaming progressive web app." />
    <meta name="theme-color" content="#090D16" />
    <meta name="application-name" content="Sonora" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sonora" />
    <meta name="msapplication-TileColor" content="#090D16" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Splash Screen Styles -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090D16;
        background-image: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(124,58,237,0.13) 0%, transparent 70%);
        transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.7s;
        overflow: hidden;
      }
      #splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Floating ambient particles */
      .splash-particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        animation: splashFloat linear infinite;
      }
      .splash-particle:nth-child(1) { width:7px;  height:7px;  background:rgba(167,139,250,0.55); top:18%; left:14%; animation-duration:6s; animation-delay:0.5s; }
      .splash-particle:nth-child(2) { width:5px;  height:5px;  background:rgba(99,102,241,0.5);   top:72%; left:82%; animation-duration:8s; animation-delay:1s;   }
      .splash-particle:nth-child(3) { width:9px;  height:9px;  background:rgba(139,92,246,0.4);   top:28%; left:76%; animation-duration:7s; animation-delay:0.2s; }
      .splash-particle:nth-child(4) { width:5px;  height:5px;  background:rgba(167,139,250,0.35); top:76%; left:18%; animation-duration:9s; animation-delay:0.8s; }

      /* Logo wrapper — responsive via clamp */
      .splash-logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: clamp(128px, 20vw, 158px);
        height: clamp(128px, 20vw, 158px);
      }

      /* Outer conic-gradient spinner ring */
      .splash-ring-outer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(124,58,237,0.15) 60deg,
          rgba(139,92,246,0.95) 180deg,
          rgba(167,139,250,1) 240deg,
          transparent 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
        mask:         radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
        opacity: 0;
        animation: splashSpin 1.1s linear infinite, splashRingFade 0.4s ease 0.15s forwards;
      }

      /* Inner counter-rotating ring */
      .splash-ring-inner {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: rgba(99,102,241,0.65);
        border-left-color: rgba(99,102,241,0.2);
        opacity: 0;
        animation: splashSpinReverse 1.9s linear infinite, splashRingFade 0.4s ease 0.3s forwards;
      }

      /* Pulsing glow halo */
      .splash-glow {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124,58,237,0.24) 0%, transparent 65%);
        opacity: 0;
        animation: splashGlow 2s ease-in-out 0.4s infinite;
      }

      /* Logo */
      .splash-logo {
        width:  clamp(70px, 11vw, 90px);
        height: clamp(70px, 11vw, 90px);
        border-radius: clamp(16px, 2.5vw, 22px);
        object-fit: contain;
        opacity: 0;
        position: relative;
        z-index: 1;
        filter: drop-shadow(0 4px 22px rgba(124,58,237,0.5));
        animation: splashPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* Brand name */
      .splash-name {
        margin-top: clamp(18px, 3vw, 26px);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: clamp(20px, 4vw, 28px);
        font-weight: 800;
        letter-spacing: 0.1em;
        color: #fff;
        opacity: 0;
        animation: splashFadeUp 0.5s ease 0.4s forwards;
      }
      .splash-name span {
        background: linear-gradient(90deg, #c4b5fd, #a78bfa, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Tagline */
      .splash-tagline {
        margin-top: clamp(4px, 1vw, 7px);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: clamp(9px, 1.6vw, 11px);
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(148,163,184,0.65);
        opacity: 0;
        animation: splashFadeUp 0.5s ease 0.55s forwards;
      }

      /* Bouncing dots */
      .splash-dots {
        margin-top: clamp(18px, 3vw, 28px);
        display: flex;
        align-items: center;
        gap: clamp(6px, 1.2vw, 9px);
        opacity: 0;
        animation: splashFadeUp 0.4s ease 0.65s forwards;
      }
      .splash-dots span {
        border-radius: 50%;
        animation: splashDot 1.3s ease-in-out infinite;
        width:  clamp(5px, 1vw, 7px);
        height: clamp(5px, 1vw, 7px);
      }
      .splash-dots span:nth-child(1) { animation-delay: 0s;   background: rgba(167,139,250,0.9); }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; background: rgba(139,92,246,0.8);  }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; background: rgba(99,102,241,0.7);  }

      /* Keyframes */
      @keyframes splashPop {
        from { opacity: 0; transform: scale(0.65); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes splashSpin        { to { transform: rotate(360deg);  } }
      @keyframes splashSpinReverse { to { transform: rotate(-360deg); } }
      @keyframes splashRingFade    { to { opacity: 1; } }
      @keyframes splashGlow {
        0%, 100% { opacity: 0;   transform: scale(0.88); }
        50%       { opacity: 1;   transform: scale(1.12); }
      }
      @keyframes splashFadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes splashDot {
        0%, 80%, 100% { transform: scale(0.55); opacity: 0.35; }
        40%            { transform: scale(1.3);  opacity: 1;    }
      }
      @keyframes splashFloat {
        0%   { opacity: 0;   transform: translateY(0)     scale(1);   }
        15%  { opacity: 0.8; }
        85%  { opacity: 0.5; }
        100% { opacity: 0;   transform: translateY(-65px) scale(0.5); }
      }
    </style>
  </head>
  <body class="bg-dark-bg text-dark-text dark:bg-dark-bg dark:text-dark-text antialiased selection:bg-brand-500 selection:text-white overflow-x-hidden min-h-screen scrollbar-none">
    <!-- Splash Screen -->
    <div id="splash">
      <!-- Floating ambient particles -->
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>

      <!-- Logo + dual spinner rings -->
      <div class="splash-logo-wrap">
        <div class="splash-glow"></div>
        <div class="splash-ring-outer"></div>
        <div class="splash-ring-inner"></div>
        <img class="splash-logo" src="/logo.png" alt="Sonora" />
      </div>

      <!-- Brand -->
      <p class="splash-name"><span>Sonora</span></p>
      <p class="splash-tagline">Music Streaming</p>

      <!-- Bouncing dots loader -->
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
